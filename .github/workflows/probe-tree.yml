name: Probe tree

# Throwaway diagnostic: one cloud run said lib/dev/window_soak.dart does not
# exist while the blob is definitively present at that sha. This dumps what a
# windows-latest checkout actually contains, without paying for a Flutter build.
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'
    paths:
      - '.github/workflows/probe-tree.yml'

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: What did we get
        shell: pwsh
        run: |
          Write-Host "== sha =="
          git rev-parse HEAD
          git log --oneline -1
          Write-Host "== ls-files lib/dev =="
          git ls-files lib/dev
          Write-Host "== cat-file HEAD:lib/dev/window_soak.dart (first line) =="
          git cat-file -p HEAD:lib/dev/window_soak.dart 2>&1 | Select-Object -First 2
          Write-Host "== disk: lib =="
          Get-ChildItem lib -Force | Select-Object Name, Mode, Length | Format-Table -AutoSize | Out-String
          Write-Host "== disk: lib/dev =="
          if (Test-Path lib/dev) {
            Get-ChildItem lib/dev -Force | Select-Object Name, Length | Format-Table -AutoSize | Out-String
            Write-Host ("item kind: " + (Get-Item lib/dev).Attributes)
          } else {
            Write-Host "lib/dev DOES NOT EXIST on the runner"
          }
          Write-Host "== git status =="
          git status --short
          Write-Host "== ignore rules =="
          git check-ignore -v lib/dev/window_soak.dart
